name: cd

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cd:
    name: Deploy production
    runs-on: ubuntu-latest

    steps:
      - name: Install cloudflared
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            --output "$RUNNER_TEMP/cloudflared"
          chmod +x "$RUNNER_TEMP/cloudflared"

      - name: Configure homeserver SSH alias
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          cat > "$HOME/.ssh/config" <<EOF
          Host homeserver
            HostName ssh.dev-dtrensuri.online
            User dtrensuri
            IdentityFile $HOME/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
            ProxyCommand $RUNNER_TEMP/cloudflared access ssh --hostname %h --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Deploy through homeserver alias
        run: |
          set -euo pipefail
          ssh homeserver 'set -e; cd /var/www/my-cv; git fetch origin main; git reset --hard origin/main; ./prod.sh'
  
