services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: dt-rensuri-cv-app:production

    container_name: dt_rensuri-cv-app

    restart: unless-stopped

    env_file:
      - .env.prod
    
    environment:
      APP_NAME: ${APP_NAME:-Su-Ri}

    volumes:
      - laravel-storage:/var/www/html/storage

    expose:
      - "9000"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    networks:
      - app

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile

    image: dt-rensuri-cv-nginx:production

    container_name: dt_rensuri-cv-nginx

    restart: unless-stopped

    ports:
      - "127.0.0.1:8188:80"

    volumes:
      - ./docker/.htpasswd:/etc/nginx/.htpasswd:ro
      - laravel-storage:/var/www/html/storage:ro

    depends_on:
      - app

    networks:
      - app

  db:
    image: mysql:8.4

    container_name: dt_rensuri-cv-db

    restart: unless-stopped
    env_file:
      - .env.prod

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_DATABASE:-dt_rensuri_cv}
      MYSQL_USER: ${DB_USERNAME:-dtrensuri}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}

    volumes:
      - db_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - app

  redis:
    image: redis:7-alpine

    container_name: dt_rensuri-cv-redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    networks:
      - app

volumes:
  db_data:
  redis_data:
  laravel-storage:

networks:
  app:
